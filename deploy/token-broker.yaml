apiVersion: apps/v1
kind: Deployment
metadata:
  name: cognee-token-broker
  namespace: cognee-trial
  labels:
    app: cognee-token-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cognee-token-broker
  template:
    metadata:
      labels:
        app: cognee-token-broker
    spec:
      imagePullSecrets:
        - name: swr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: broker
          image: swr.cn-north-9.myhuaweicloud.com/link-seek/opencode-tools@sha256:51f75e112b2cdd3168dbcf565096af0dadbe60cc4d067947bb0b0697a1723d5f
          command: ["node", "/app/token-broker.mjs"]
          env:
            - {name: BROKER_PORT, value: "8787"}
            - {name: COGNEE_BASE_URL, value: "http://cognee.cognee-trial.svc.cluster.local:8001"}
            - name: BROKER_TOKENS
              valueFrom: {secretKeyRef: {name: cognee-broker-env, key: BROKER_TOKENS}}
            - name: COGNEE_USERS
              valueFrom: {secretKeyRef: {name: cognee-broker-env, key: COGNEE_USERS}}
          ports:
            - {name: http, containerPort: 8787}
          readinessProbe:
            httpGet: {path: /health, port: 8787}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8787}
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - {name: broker-src, mountPath: /app/token-broker.mjs, subPath: token-broker.mjs, readOnly: true}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
      volumes:
        - name: broker-src
          configMap:
            name: cognee-token-broker
---
apiVersion: v1
kind: Service
metadata:
  name: cognee-token-broker
  namespace: cognee-trial
  labels:
    app: cognee-token-broker
spec:
  selector:
    app: cognee-token-broker
  ports:
    - {name: http, port: 8787, targetPort: 8787}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cognee-token-broker
  namespace: cognee-trial
  labels:
    app: cognee-token-broker
spec:
  podSelector:
    matchLabels:
      app: cognee-token-broker
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {port: 8787, protocol: TCP}
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opencode-xieyucheng
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opencode-yingxin
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opencode-team
  egress:
    - {} # allow DNS + Cognee REST; tighten if egress policy exists
